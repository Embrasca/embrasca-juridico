<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Embrasca Jurídico</title>
  <style>html,body{margin:0;min-height:100%;background:#0b1510;color:#fff;font-family:Arial,sans-serif}</style>
</head>
<body>
  <script>
  (async () => {
    const response = await fetch('/app.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('Não foi possível carregar a aplicação.');
    let html = await response.text();
    const marker = '</body>';
    if (!html.includes(marker)) throw new Error('Estrutura da aplicação inválida.');

    const authGate = '<style id="central-auth-gate">#app,#setup{display:none!important}</style>';
    html = html.replace('</head>', authGate + '</head>');

    const scripts = [
      '<script src="/auth-client.js?v=20260904"><\/script>',
      '<script src="/task2-core.js?v=20260901"><\/script>',
      '<script src="/docx-patch.js?v=20260901"><\/script>',
      '<script src="/task2-ui.js?v=20260901"><\/script>'
    ].join('');
    html = html.replace(marker, scripts + marker);
    document.open();
    document.write(html);
    document.close();
  })().catch((error) => {
    console.error('[EMBRASCA JURÍDICO]', error);
    document.body.innerHTML = '<div style="padding:32px">Falha ao carregar o sistema. Atualize a página.</div>';
  });
  </script>
</body>
</html>
