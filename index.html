<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Embrasca Jurídico</title>
  <style>html,body{margin:0;min-height:100%;background:#0b1510;color:#fff;font-family:Arial,sans-serif}.boot{padding:32px}</style>
</head>
<body>
  <div class="boot">Carregando Embrasca Jurídico...</div>
  <script>
  (async () => {
    const response = await fetch('/app.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('Não foi possível carregar a aplicação.');
    let html = await response.text();
    const marker = '</body>';
    if (!html.includes(marker)) throw new Error('Estrutura da aplicação inválida.');
    html = html.replace(marker, '<script src="/docx-patch.js?v=20260901"><\/script>' + marker);
    document.open();
    document.write(html);
    document.close();
  })().catch((error) => {
    console.error('[EMBRASCA JURÍDICO]', error);
    document.body.innerHTML = '<div class="boot">Falha ao carregar o sistema. Atualize a página.</div>';
  });
  </script>
</body>
</html>
